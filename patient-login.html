<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Login - HEKSAA</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <h1>HEKSAA</h1>

    </header>


    <main>

        <section class="login-section">

            <h2>Patient Login</h2>

            <p>
                Sign in to access your HEKSAA account.
            </p>


            <form id="patient-login-form">

                <input
                    type="email"
                    placeholder="Email address"
                    required
                >


                <input
                    type="password"
                    placeholder="Password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </main>


    <script>

        document
            .getElementById("patient-login-form")
            .addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();

                    window.location.href =
                        "patient-dashboard.html";

                }
            );

    </script>

</body>

</html>
