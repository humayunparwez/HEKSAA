<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found - HEKSAA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family: Arial, sans-serif;

            background: #f6f7fb;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 550px;

            text-align: center;

            background: white;
            border: 1px solid #e1e5ed;
            border-radius: 25px;

            padding: 45px 30px;

            box-shadow:
                0 15px 45px rgba(15, 23, 42, 0.07);
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            border-radius: 22px;

            background: #4f46e5;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
            font-weight: bold;
        }

        .code {
            color: #4f46e5;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 14px;
        }

        p {
            color: #64748b;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .button {
            display: inline-block;

            background: #4f46e5;
            color: white;

            text-decoration: none;

            padding: 14px 25px;

            border-radius: 12px;

            font-weight: bold;
        }

        .button:hover {
            background: #4338ca;
        }

        @media (max-width: 600px) {

            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        H
    </div>

    <div class="code">
        ERROR 404
    </div>

    <h1>
        Page Not Found
    </h1>

    <p>
        The page you're looking for doesn't exist or
        may have been moved. Let's get you back to HEKSAA.
    </p>

    <a
        href="index.html"
        class="button"
    >
        ← Return to HEKSAA
    </a>

</div>

</body>

</html>
